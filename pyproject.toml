[project]
name = "gen-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "shashikant-bhardwaj", email = "bhardwajshashi531@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "huggingface-hub>=1.29.0",
    "langchain>=1.3.18",
    "langchain-google-genai>=4.4.0",
    "langchain-huggingface>=1.2.2",
    "langchain-mistralai>=1.1.6",
    "python-dotenv>=1.2.3",
]

[project.scripts]
gen-ai = "gen_ai:main"

[build-system]
requires = ["uv_build>=0.12.8,<0.13.0"]
build-backend = "uv_build"
